<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insects APT;</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="brand">Insects APT; 벌레 아파트.</div>
    <nav>
      <ul class="menu">
        <li><a href="#">Species List (Korean & English)</a></li>
        <li><a href="#">Common etc.</a></li>
      </ul>
      <div class="date">2025.06.25</div>
    </nav>
  </header>
  <hr />

  <main>
    <!-- 1. Top insect gallery -->
    <section class="gallery grid-4">
      <button class="item" data-desc="This is Insect larva 01 – found in tropical regions and known for its vibrant patterns.">
        <img src="https://placehold.co/220x140?text=insect1" alt="Insect 1" />
        <span class="caption">Insect larva 01</span>
      </button>
      <button class="item" data-desc="Insect larva 02 – a small species that thrives in humid environments.">
        <img src="https://placehold.co/80x140?text=insect2" alt="Insect 2" />
        <span class="caption">Insect larva 02</span>
      </button>
      <button class="item rotated" data-desc="Insect larva 03 – notable for its unique camouflage abilities.">
        <img src="https://placehold.co/110x190?text=insect3" alt="Insect 3" />
        <span class="caption">Insect larva 03</span>
      </button>
      <button class="item" data-desc="Insect larva 04 – often seen in temperate zones and recognized for its wing shape.">
        <img src="https://placehold.co/300x120?text=insect4" alt="Insect 4" />
        <span class="caption">Insect larva 04</span>
      </button>
    </section>

    <!-- 2. Gesture section -->
    <section class="gesture">
      <h2 class="sr-only">Gesture</h2>
      <img src="https://placehold.co/200x300?text=HAND" alt="Gesture hand silhouette" />
      <p class="caption">
        Gesture for search and swap
      </p>
    </section>

    <!-- 3. Birds pair -->
    <section class="birds grid-2">
      <img src="https://placehold.co/260x180?text=bird1" alt="Bird 1" />
      <img src="https://placehold.co/260x180?text=bird2" alt="Bird 2" />
    </section>

    <!-- 4. Arrow / icon section -->
    <section class="arrow-section">
      <img class="circle-icon" src="https://placehold.co/200x200?text=icon" alt="Arrow Icon" />
      <p class="small-caption">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      </p>
    </section>

    <!-- 5. Mosquito smaller section -->
    <section class="mosquito">
      <img class="circle-icon" src="https://placehold.co/200x200?text=icon" alt="Arrow Icon" />
      <p class="small-caption">Some reflective subtext etc. 1:29</p>
    </section>

    <!-- 6. Footer banner with big mosquito and title -->
    <section class="footer-banner">
      <img src="https://placehold.co/350x220?text=mosquito" alt="Mosquito large" />
      <h1 class="page-end">Insects APT.</h1>
      <footer class="credits">
        <a href="#">Email</a>
        <span>&copy; 2025</span>
      </footer>
    </section>
    <!-- Modal overlay -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <p id="modalText"></p>
      <button id="modalClose">Close</button>
    </div>
  </div>
</main>
</body>
</html>
